[project]
name = "ai-crawling-pipeline"
version = "0.1.2"
description = "AI crawler pipeline to extract, format, summarize and categorize Web Content"
readme = "README.md"
authors = [
    { name = "Ezzaldin Mamdouh", email = "kingtal632@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crawl4ai>=0.7.4,<1.0",
    "openai>=1.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "google-generativeai>=0.7,<1.0",
    "sqlite-vec>=0.1,<2.0",
    "pysqlite3-binary>=0.5.4,<1.0",
    "feedparser>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "boto3>=1.34,<2.0",
    "googlenewsdecoder~=0.1.7",
    "litellm>=1.60,<2.0",
    "google-auth>=2.0,<3.0",
    "PyJWT>=2.0,<3.0",
]

[project.scripts]
ai-crawling-pipeline = "ai_crawling_pipeline:main"
radar-pipeline = "radar_pipeline:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[dynamodb]>=5.0,<6.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# uv_build's default package discovery only picks the module matching the
# normalized project name (ai_crawling_pipeline) — radar_pipeline silently
# never made it into a built wheel. Harmless under `uv run`/`uv sync` (dev
# mode adds src/ straight to sys.path, bypassing wheel packaging entirely),
# but a real `pip install .` — e.g. the Docker build — installed a wheel
# with no radar_pipeline in it, and `radar-pipeline` failed at startup with
# ModuleNotFoundError. Listing both modules explicitly is what makes a
# real wheel build actually contain both console scripts' packages.
module-name = ["ai_crawling_pipeline", "radar_pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::FutureWarning",
]

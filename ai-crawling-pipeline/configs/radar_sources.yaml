# Radar Aftermarket — Source Catalog
# Auto-generated port of getFontes_() from codigo.gs.
# ~70+ automotive aftermarket sources for the Brazilian market.
#
# Each source:
#   source_id:   stable slug (auto-generated from name if omitted)
#   name:        display name
#   source_type: portal | entidade | concorrente | tema | tecnologia | economia | lancamento
#   tag:         competitor / entity tag
#   product_line: default product line
#   category:    auto | economia | tecnologia
#   feed_type:   rss_direct | google_news_query | linkedin_company
#                (auto-detected as rss_direct from rss_url presence; must be
#                set explicitly for linkedin_company — see below)
#   rss_url:     (optional) direct RSS feed URL
#   query_text:  (optional) Google News search query; for feed_type
#                linkedin_company, the LinkedIn company slug instead
#                (e.g. "bosch", or "showcase/mahle-aftermarket-parts" for a
#                LinkedIn Showcase page)
#   active:      true | false

